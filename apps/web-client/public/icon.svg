<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-opacity="0.5"/>

  <!-- Medical Cross / Dental Crown Combined Motif -->
  <g filter="url(#glow)">
    <!-- Central Modern Plus Cross -->
    <path d="M 216 110 L 296 110 A 16 16 0 0 1 312 126 L 312 200 L 386 200 A 16 16 0 0 1 402 216 L 402 296 A 16 16 0 0 1 386 312 L 312 312 L 312 386 A 16 16 0 0 1 296 402 L 216 402 A 16 16 0 0 1 200 386 L 200 312 L 126 312 A 16 16 0 0 1 110 296 L 110 216 A 16 16 0 0 1 126 200 L 200 200 L 200 126 A 16 16 0 0 1 216 110 Z" fill="url(#cyanGrad)"/>
    
    <!-- Dental Tooth Crown Cutout In Center -->
    <path d="M 236 210 C 236 195, 276 195, 276 210 C 282 225, 288 250, 276 290 C 268 296, 264 275, 256 275 C 248 275, 244 296, 236 290 C 224 250, 230 225, 236 210 Z" fill="#020617"/>
    <circle cx="256" cy="235" r="8" fill="#22d3ee"/>
  </g>

  <!-- Pulse EKG Line Accent -->
  <path d="M 80 256 L 160 256 L 180 210 L 200 300 L 220 230 L 240 256 L 272 256 L 292 220 L 312 290 L 332 256 L 432 256" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
</svg>
