version: '3.8'

services:
  # PostgreSQL 16 Enterprise Database with row-level locking & append-only immutable triggers
  postgres:
    image: postgres:16-alpine
    container_name: smartopd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartopd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./crates/db-schema/migrations/001_unified_schema.sql:/docker-entrypoint-initdb.d/001_unified_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartopd"]
      interval: 5s
      timeout: 5s
      retries: 5

  # High-Performance Rust Axum + Tokio Actor Backend
  api-server:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: smartopd-api
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/smartopd
      RUST_LOG: info,api_server=debug
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Next.js 16 Progressive Web Application (PWA)
  web-client:
    build:
      context: ./apps/web-client
      dockerfile: Dockerfile
    container_name: smartopd-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api-server

volumes:
  pgdata:
    driver: local
